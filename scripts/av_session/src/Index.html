<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #202124;
        background: #f7f9fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 14px 76px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h2 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0;
        overflow-x: auto;
        white-space: nowrap;
      }

      .subtitle {
        margin: 0 0 6px;
        color: #5f6368;
        font-size: 12px;
        line-height: 1.25;
      }

      .status {
        min-height: 18px;
        font-size: 12px;
        color: #5f6368;
      }

      .status.error {
        color: #b3261e;
      }

      .status.success {
        color: #137333;
      }

      label {
        display: grid;
        gap: 3px;
        color: #3c4043;
        font-size: 12px;
        font-weight: 700;
      }

      select,
      input[type="text"],
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid #c7cdd6;
        border-radius: 6px;
        background: #fff;
        color: #202124;
        font-size: 12px;
      }

      select,
      input[type="text"] {
        height: 28px;
        padding: 0 8px;
      }

      textarea {
        height: 64px;
        padding: 6px 8px;
        resize: vertical;
        line-height: 1.35;
      }

      input[type="checkbox"] {
        width: 14px;
        height: 14px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
        margin: 8px 0 10px;
      }

      .toolbar[hidden],
      .table-wrap[hidden] {
        display: none;
      }

      label[hidden],
      .bubble-button[hidden],
      .nav-arrow[hidden],
      .tutor-comment[hidden] {
        display: none;
      }

      .table-wrap {
        overflow-x: auto;
        border-top: 1px solid #d8dee8;
        padding-top: 2px;
      }

      .table-title-nav {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) 30px;
        gap: 8px;
        align-items: center;
        margin: 8px 0 6px;
      }

      .nav-arrow {
        width: 30px;
        height: 30px;
        border: 1px solid #c7cdd6;
        border-radius: 6px;
        background: #fff;
        color: #202124;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      .nav-arrow:disabled {
        cursor: not-allowed;
        opacity: 0.38;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        border-bottom: 1px solid #e4e8ef;
        padding: 3px 6px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: #e9eef6;
        color: #202124;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
      }

      td {
        min-width: 160px;
        font-size: 12px;
      }

      td.primary-cell {
        min-width: 220px;
        font-weight: 600;
        white-space: nowrap;
      }

      tr.closed-row td.primary-cell {
        width: 100%;
        min-width: 360px;
      }

      td.checkbox-cell,
      th.pi-header {
        width: 38px;
        min-width: 38px;
        max-width: 38px;
        text-align: center;
      }

      td.action-cell {
        min-width: 92px;
        width: 92px;
        text-align: center;
      }

      .table-link {
        color: #0b57d0;
        font-weight: 700;
        text-decoration: none;
      }

      .table-link:hover {
        text-decoration: underline;
      }

      tr.dirty td {
        background: #fff6c7;
      }

      select.subject-evaluation-select {
        background: var(--evaluation-color, #fff);
      }

      .admin-note {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        margin-left: 6px;
        border: 1px solid #f2c94c;
        border-radius: 6px;
        padding: 0 6px;
        background: #fff8dc;
        color: #684e00;
        font-size: 11px;
        font-weight: 700;
      }

      .tutor-comment {
        margin-top: 8px;
      }

      .bubble-actions {
        position: fixed;
        right: 24px;
        bottom: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .bubble-button {
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 50%;
        background: #0b57d0;
        color: #fff;
        box-shadow: 0 8px 22px rgba(32, 33, 36, 0.28);
        font-size: 26px;
        line-height: 58px;
        cursor: pointer;
      }

      .bubble-button svg {
        width: 28px;
        height: 28px;
        vertical-align: middle;
      }

      .bubble-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(248, 250, 253, 0.78);
        backdrop-filter: blur(1px);
        z-index: 10;
      }

      .overlay[hidden] {
        display: none;
      }

      .loader {
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: min(360px, calc(100vw - 48px));
        padding: 28px 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 34px rgba(32, 33, 36, 0.18);
        color: #202124;
        font-weight: 700;
        text-align: center;
      }

      #overlay-message {
        white-space: pre-line;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #c7d2e6;
        border-top-color: #0b57d0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      body.busy main,
      body.busy .bubble-actions {
        filter: grayscale(0.35);
        opacity: 0.38;
        pointer-events: none;
        user-select: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 920px) {
        .toolbar {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 620px) {
        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="busy">
    <main>
      <h1>Sessió d'avaluació <span id="admin-note" class="admin-note" hidden>Admin</span></h1>
      <p id="subtitle" class="subtitle"></p>
      <div id="status" class="status"></div>

      <section id="toolbar" class="toolbar" hidden>
        <label id="evaluation-label" for="evaluation-selector">
          Avaluació
          <select id="evaluation-selector"></select>
        </label>
        <label id="group-label" for="group-selector">
          Grup
          <select id="group-selector"></select>
        </label>
        <label id="student-label" for="student-selector">
          Alumne
          <select id="student-selector" disabled>
            <option value="">Selecciona un alumne...</option>
          </select>
        </label>
        <label id="subject-label" for="subject-selector">
          Matèria
          <select id="subject-selector" disabled>
            <option value="">Selecciona una matèria...</option>
          </select>
        </label>
      </section>

      <section id="table-wrap" class="table-wrap" hidden>
        <div id="table-title-nav" class="table-title-nav">
          <button id="prev-button" class="nav-arrow" type="button" aria-label="Anterior" title="Anterior" disabled>‹</button>
          <h2 id="table-title"></h2>
          <button id="next-button" class="nav-arrow" type="button" aria-label="Següent" title="Següent" disabled>›</button>
        </div>
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
        <label id="tutor-comment-label" class="tutor-comment" for="tutor-comment">
          Comentari del tutor
          <textarea id="tutor-comment" rows="3"></textarea>
        </label>
      </section>
    </main>

    <div class="bubble-actions">
      <button id="save-button" class="bubble-button" type="button" aria-label="Desar canvis" title="Desar canvis" disabled>💾</button>
      <button id="print-button" class="bubble-button" type="button" aria-label="Descarregar butlletí en PDF" title="Descarregar butlletí en PDF" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6zM18 13h.01"/>
        </svg>
      </button>
      <button id="csv-button" class="bubble-button" type="button" aria-label="Descarregar acta Excel" title="Descarregar acta Excel" hidden disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8M8 9h2"/>
        </svg>
      </button>
      <button id="bulk-pdf-button" class="bubble-button" type="button" aria-label="Generar butlletins pendents" title="Generar butlletins pendents" hidden disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15h6M12 12v6"/>
        </svg>
      </button>
      <button id="bulk-mail-button" class="bubble-button" type="button" aria-label="Enviar correus pendents" title="Enviar correus pendents" hidden disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16v16H4zM22 6l-10 7L2 6"/>
        </svg>
      </button>
    </div>

    <div id="overlay" class="overlay">
      <div class="loader" role="status" aria-live="polite" aria-busy="true">
        <div class="spinner" aria-hidden="true"></div>
        <div id="overlay-message">Carregant dades...</div>
      </div>
    </div>

    <script>
      let state = {
        evaluations: [],
        groups: [],
        selectedEvaluation: '',
        selectedGroup: '',
        evaluationData: null,
        rowsData: null,
        dirtyRows: new Map(),
        tutorCommentDirty: false,
        lastTutorComment: ''
      };

      document.addEventListener('DOMContentLoaded', loadInitialData);
      document.getElementById('evaluation-selector').addEventListener('change', handlePrimarySelectionChange);
      document.getElementById('group-selector').addEventListener('change', handlePrimarySelectionChange);
      document.getElementById('student-selector').addEventListener('change', handleStudentChange);
      document.getElementById('subject-selector').addEventListener('change', handleSubjectChange);
      document.getElementById('save-button').addEventListener('click', saveChanges);
      document.getElementById('print-button').addEventListener('click', downloadStudentReport);
      document.getElementById('csv-button').addEventListener('click', downloadClosedXlsx);
      document.getElementById('bulk-pdf-button').addEventListener('click', generateMissingClosedBulletins);
      document.getElementById('bulk-mail-button').addEventListener('click', sendPendingClosedEmails);
      document.getElementById('prev-button').addEventListener('click', () => navigateSelection(-1));
      document.getElementById('next-button').addEventListener('click', () => navigateSelection(1));
      document.getElementById('tutor-comment').addEventListener('input', handleTutorCommentInput);

      function loadInitialData() {
        setBusy(true, 'Carregant dades...');
        google.script.run
          .withSuccessHandler(data => {
            state.evaluations = data.evaluations || [];
            state.groups = data.groups || [];
            renderContext(data);
            renderPrimarySelectors();
            document.getElementById('toolbar').hidden = false;
            syncPrimarySelectionFromDom();
            if (state.selectedEvaluation && state.selectedGroup) {
              loadEvaluationData();
            } else {
              setBusy(false);
              setStatus('Selecciona una avaluació i un grup.');
            }
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .getAvSessionData();
      }

      function renderContext(data) {
        const actingTeacher = data.actingTeacher || {};
        const effectiveTeacher = data.effectiveTeacher || {};
        document.getElementById('admin-note').hidden = !data.isAdmin;
        document.getElementById('subtitle').textContent = data.isSubstituteActing
          ? `${actingTeacher.fullName} actuant per ${effectiveTeacher.fullName}`
          : effectiveTeacher.fullName || data.userEmail || '';
      }

      function renderPrimarySelectors() {
        const evaluationSelector = document.getElementById('evaluation-selector');
        const groupSelector = document.getElementById('group-selector');
        evaluationSelector.innerHTML = '<option value="">Selecciona una avaluació...</option>';
        groupSelector.innerHTML = '<option value="">Selecciona un grup...</option>';

        state.evaluations.forEach(evaluation => {
          evaluationSelector.appendChild(createOption(evaluation.sheetName, evaluation.name));
        });
        state.groups.forEach(group => {
          groupSelector.appendChild(createOption(group.dinantiaGroupName, group.dinantiaGroupName));
        });

        if (state.evaluations.length === 1) {
          evaluationSelector.value = state.evaluations[0].sheetName;
        }
        if (state.groups.length === 1) {
          groupSelector.value = state.groups[0].dinantiaGroupName;
        }

        syncPrimarySelectionFromDom();
      }

      function handlePrimarySelectionChange() {
        syncPrimarySelectionFromDom();
        state.evaluationData = null;
        state.rowsData = null;
        state.dirtyRows = new Map();
        state.tutorCommentDirty = false;
        state.lastTutorComment = '';
        resetDetailSelectors();
        clearTable();

        if (!state.selectedEvaluation || !state.selectedGroup) {
          setStatus('Selecciona una avaluació i un grup.');
          return;
        }

        loadEvaluationData();
      }

      function syncPrimarySelectionFromDom() {
        state.selectedEvaluation = document.getElementById('evaluation-selector').value;
        state.selectedGroup = document.getElementById('group-selector').value;
      }

      function loadEvaluationData() {
        setBusy(true, 'Carregant alumnes i matèries...');
        google.script.run
          .withSuccessHandler(data => {
            state.evaluationData = data;
            state.dirtyRows = new Map();
            state.tutorCommentDirty = false;
            state.lastTutorComment = '';
            setBusy(false);
            if (isClosedMode()) {
              renderClosedMode();
              setStatus(data.message || '');
              return;
            }
            renderDetailSelectors();
            setStatus(data.message || 'Selecciona un alumne o una matèria.');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .getAvSessionEvaluationData({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup
          });
      }

      function resetDetailSelectors() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        studentSelector.innerHTML = '<option value="">Selecciona un alumne...</option>';
        subjectSelector.innerHTML = '<option value="">Selecciona una matèria...</option>';
        studentSelector.disabled = true;
        subjectSelector.disabled = true;
        document.getElementById('student-label').hidden = false;
        document.getElementById('subject-label').hidden = false;
        resetTutorComment();
        updateActionButtons();
      }

      function renderDetailSelectors() {
        document.getElementById('student-label').hidden = false;
        document.getElementById('subject-label').hidden = false;
        document.getElementById('table-title-nav').hidden = false;
        document.getElementById('prev-button').hidden = false;
        document.getElementById('next-button').hidden = false;
        document.getElementById('tutor-comment-label').hidden = false;

        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        studentSelector.innerHTML = '<option value="">Selecciona un alumne...</option>';
        subjectSelector.innerHTML = '<option value="">Selecciona una matèria...</option>';

        (state.evaluationData.students || []).forEach(student => {
          studentSelector.appendChild(createOption(student.name, student.name));
        });
        (state.evaluationData.subjects || []).forEach(subject => {
          subjectSelector.appendChild(createOption(subject, subject));
        });

        studentSelector.disabled = false;
        subjectSelector.disabled = false;
      }

      function renderClosedMode() {
        document.getElementById('student-label').hidden = true;
        document.getElementById('subject-label').hidden = true;
        document.getElementById('student-selector').disabled = true;
        document.getElementById('subject-selector').disabled = true;
        document.getElementById('table-title-nav').hidden = false;
        document.getElementById('prev-button').hidden = true;
        document.getElementById('next-button').hidden = true;
        document.getElementById('tutor-comment-label').hidden = true;
        renderClosedTable();
      }

      function handleStudentChange() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        if (studentSelector.value) {
          subjectSelector.value = '';
        }
        loadRowsForCurrentSelection();
      }

      function handleSubjectChange() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        if (subjectSelector.value) {
          studentSelector.value = '';
        }
        loadRowsForCurrentSelection();
      }

      function loadRowsForCurrentSelection() {
        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        state.rowsData = null;
        state.dirtyRows = new Map();
        state.tutorCommentDirty = false;
        clearTable();

        if (!selectedStudent && !selectedSubject) {
          resetTutorComment();
          setStatus('Selecciona un alumne o una matèria.');
          return;
        }

        const rows = (state.evaluationData.rows || [])
          .filter(row => selectedStudent
            ? row.studentFullName === selectedStudent
            : row.subjectFullName === selectedSubject)
          .slice()
          .sort((a, b) => selectedStudent
            ? a.subjectFullName.localeCompare(b.subjectFullName, 'ca', { sensitivity: 'base' })
            : a.studentFullName.localeCompare(b.studentFullName, 'ca', { sensitivity: 'base' }));

        state.rowsData = {
          evaluation: state.evaluationData.evaluation,
          group: state.selectedGroup,
          mode: selectedStudent ? 'student' : 'subject',
          selectedStudent,
          selectedSubject,
          rows,
          gradeFieldsEditable: state.evaluationData.gradeFieldsEditable !== false,
          subjectEvaluationOptions: state.evaluationData.subjectEvaluationOptions || [],
          subjectEvaluationColors: state.evaluationData.subjectEvaluationColors || {},
          conceptColumns: state.evaluationData.conceptColumns || [],
          message: rows.length ? '' : 'No hi ha files per a la selecció actual.'
        };
        syncTutorCommentForSelection();
        renderTable();
        setStatus(state.rowsData.message || '');
      }

      function renderTable() {
        const tableWrap = document.getElementById('table-wrap');
        const tableTitle = document.getElementById('table-title');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        if (!state.rowsData || !(state.rowsData.rows || []).length) {
          tableWrap.hidden = true;
          updateActionButtons();
          return;
        }

        const conceptColumns = state.rowsData.conceptColumns || [];
        const primaryHeader = state.rowsData.mode === 'student' ? 'Matèria' : 'Alumne';
        const titleDetail = state.rowsData.mode === 'student'
          ? state.rowsData.selectedStudent
          : state.rowsData.selectedSubject;
        tableTitle.textContent = '';
        tableHead.appendChild(renderHeaderRow(primaryHeader, conceptColumns));
        state.rowsData.rows.forEach(row => {
          tableBody.appendChild(renderDataRow(row, primaryHeader, conceptColumns));
        });
        tableWrap.hidden = false;
        updateNavigationButtons();
        updateActionButtons();
      }

      function renderClosedTable() {
        const tableWrap = document.getElementById('table-wrap');
        const tableTitle = document.getElementById('table-title');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        const rows = state.evaluationData && state.evaluationData.closedRows || [];
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';
        tableTitle.textContent = '';
        resetTutorComment();

        if (!rows.length) {
          tableWrap.hidden = true;
          updateActionButtons();
          return;
        }

        const header = document.createElement('tr');
        ['Alumne', 'Butlletí', 'Enviat'].forEach(text => {
          const th = document.createElement('th');
          th.textContent = text;
          header.appendChild(th);
        });
        tableHead.appendChild(header);

        rows.forEach(row => tableBody.appendChild(renderClosedRow(row)));
        tableWrap.hidden = false;
        updateNavigationButtons();
        updateActionButtons();
      }

      function renderClosedRow(row) {
        const tr = document.createElement('tr');
        tr.className = 'closed-row';
        tr.dataset.student = row.studentFullName || '';
        tr.dataset.studentAccountId = row.studentAccountId || '';

        const studentCell = document.createElement('td');
        studentCell.className = 'primary-cell';
        studentCell.textContent = row.studentFullName || '';
        tr.appendChild(studentCell);

        const bulletinCell = document.createElement('td');
        bulletinCell.className = 'action-cell';
        if (row.bulletinUrl) {
          const link = document.createElement('a');
          link.className = 'table-link';
          link.href = row.bulletinUrl;
          link.target = '_blank';
          link.rel = 'noopener';
          link.title = 'Obrir butlletí';
          link.textContent = 'PDF';
          bulletinCell.appendChild(link);
        } else {
          const link = document.createElement('a');
          link.className = 'table-link';
          link.href = '#';
          link.textContent = 'Generar';
          link.addEventListener('click', event => {
            event.preventDefault();
            generateClosedBulletin(row);
          });
          bulletinCell.appendChild(link);
        }
        tr.appendChild(bulletinCell);

        const sentCell = document.createElement('td');
        sentCell.className = 'action-cell';
        if (row.sent) {
          sentCell.textContent = '✓';
          sentCell.title = 'Enviat';
        } else {
          const link = document.createElement('a');
          link.className = 'table-link';
          link.href = '#';
          link.textContent = 'Enviar';
          link.addEventListener('click', event => {
            event.preventDefault();
            sendClosedBulletin(row);
          });
          sentCell.appendChild(link);
        }
        tr.appendChild(sentCell);

        return tr;
      }

      function syncTutorCommentForSelection() {
        const textarea = document.getElementById('tutor-comment');
        if (!state.rowsData || state.rowsData.mode !== 'student') {
          state.lastTutorComment = '';
          state.tutorCommentDirty = false;
          textarea.value = '';
          textarea.disabled = true;
          textarea.dataset.locked = 'true';
          textarea.placeholder = 'Selecciona un alumne per editar el comentari.';
          return;
        }

        const comment = getTutorCommentForCurrentStudent();
        state.lastTutorComment = comment;
        state.tutorCommentDirty = false;
        textarea.value = comment;
        textarea.disabled = false;
        textarea.dataset.locked = 'false';
        textarea.placeholder = '';
      }

      function resetTutorComment() {
        const textarea = document.getElementById('tutor-comment');
        state.tutorCommentDirty = false;
        state.lastTutorComment = '';
        textarea.value = '';
        textarea.disabled = true;
        textarea.dataset.locked = 'true';
        textarea.placeholder = 'Selecciona un alumne per editar el comentari.';
      }

      function getTutorCommentForCurrentStudent() {
        if (!state.evaluationData || !state.rowsData) return '';

        const accountId = getCurrentStudentAccountId();
        const commentsByAccount = state.evaluationData.tutorCommentsByStudentAccountId || {};
        if (accountId && Object.prototype.hasOwnProperty.call(commentsByAccount, accountId)) {
          return commentsByAccount[accountId] || '';
        }

        const commentsByName = state.evaluationData.tutorCommentsByStudentName || {};
        const studentName = state.rowsData.selectedStudent || '';
        return commentsByName[studentName] || '';
      }

      function getCurrentStudentAccountId() {
        if (!state.rowsData || state.rowsData.mode !== 'student') return '';
        const firstRow = (state.rowsData.rows || [])[0] || {};
        return firstRow.studentAccountId || '';
      }

      function renderHeaderRow(primaryHeader, conceptColumns) {
        const tr = document.createElement('tr');
        [primaryHeader, 'PI', 'Avaluació de la matèria']
          .concat(conceptColumns.map(concept => concept.header))
          .forEach((header, index) => {
            const th = document.createElement('th');
            th.textContent = header;
            if (index === 1) {
              th.className = 'pi-header';
            }
            tr.appendChild(th);
          });
        return tr;
      }

      function renderDataRow(row, primaryHeader, conceptColumns) {
        const gradeFieldsEditable = areGradeFieldsEditable();
        const tr = document.createElement('tr');
        tr.dataset.sheetRow = row.sheetRow;
        if (state.dirtyRows.has(String(row.sheetRow))) {
          tr.classList.add('dirty');
        }

        const primaryCell = document.createElement('td');
        primaryCell.className = 'primary-cell';
        primaryCell.textContent = primaryHeader === 'Matèria' ? row.subjectFullName : row.studentFullName;
        tr.appendChild(primaryCell);

        const piCell = document.createElement('td');
        piCell.className = 'checkbox-cell';
        const piInput = document.createElement('input');
        piInput.type = 'checkbox';
        piInput.checked = row.pi === true;
        piInput.dataset.role = 'pi';
        setGradeInputState(piInput, gradeFieldsEditable);
        if (gradeFieldsEditable) {
          piInput.addEventListener('change', () => markDirty(tr));
        }
        piCell.appendChild(piInput);
        tr.appendChild(piCell);

        const subjectCell = document.createElement('td');
        const subjectEvaluationSelect = createSelectInput(
          'subjectEvaluation',
          state.rowsData.subjectEvaluationOptions || [],
          row.subjectEvaluation
        );
        subjectEvaluationSelect.classList.add('subject-evaluation-select');
        setGradeInputState(subjectEvaluationSelect, gradeFieldsEditable);
        applyEvaluationColor(subjectEvaluationSelect, row.subjectEvaluation);
        if (gradeFieldsEditable) {
          subjectEvaluationSelect.addEventListener('change', event => {
            applyEvaluationColor(event.target, event.target.value);
          });
        }
        subjectCell.appendChild(subjectEvaluationSelect);
        tr.appendChild(subjectCell);

        conceptColumns.forEach(concept => {
          const td = document.createElement('td');
          const value = row.concepts && row.concepts[concept.header] || '';
          const input = concept.options && concept.options.length
            ? createSelectInput(`concept:${concept.header}`, concept.options, value)
            : createTextInput(`concept:${concept.header}`, value);
          setGradeInputState(input, gradeFieldsEditable);
          td.appendChild(input);
          tr.appendChild(td);
        });

        return tr;
      }

      function areGradeFieldsEditable() {
        return !state.rowsData || state.rowsData.gradeFieldsEditable !== false;
      }

      function setGradeInputState(input, editable) {
        input.disabled = !editable;
        input.dataset.locked = editable ? 'false' : 'true';
      }

      function createSelectInput(role, options, value) {
        const select = document.createElement('select');
        select.dataset.role = role;
        select.appendChild(createOption('', ''));
        options.forEach(option => select.appendChild(createOption(option, option)));
        select.value = value || '';
        select.addEventListener('change', event => markDirty(event.target.closest('tr')));
        return select;
      }

      function createTextInput(role, value) {
        const input = document.createElement('input');
        input.type = 'text';
        input.dataset.role = role;
        input.value = value || '';
        input.addEventListener('input', event => markDirty(event.target.closest('tr')));
        return input;
      }

      function markDirty(tr) {
        if (!tr) return;
        tr.classList.add('dirty');
        state.dirtyRows.set(String(tr.dataset.sheetRow), collectRowPayload(tr));
        updateSaveButton();
      }

      function handleTutorCommentInput() {
        if (!state.rowsData || state.rowsData.mode !== 'student') return;
        state.tutorCommentDirty = document.getElementById('tutor-comment').value !== state.lastTutorComment;
        updateSaveButton();
      }

      function collectRowPayload(tr) {
        const concepts = {};
        Array.from(tr.querySelectorAll('[data-role^="concept:"]')).forEach(input => {
          concepts[input.dataset.role.slice('concept:'.length)] = input.value;
        });

        return {
          sheetRow: Number(tr.dataset.sheetRow),
          pi: tr.querySelector('[data-role="pi"]').checked,
          subjectEvaluation: tr.querySelector('[data-role="subjectEvaluation"]').value,
          concepts
        };
      }

      function saveChanges() {
        const rows = Array.from(state.dirtyRows.values());
        if (!state.selectedEvaluation || !state.selectedGroup || (!rows.length && !state.tutorCommentDirty)) return;

        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        setBusy(true, 'Desant...');
        google.script.run
          .withSuccessHandler(data => {
            const updatedRows = data.updatedRows || [];
            mergeSavedRowsIntoEvaluationData(updatedRows);
            mergeSavedRowsIntoRowsData(updatedRows);
            mergeSavedTutorComment(data.tutorComment);
            state.dirtyRows = new Map();
            state.tutorCommentDirty = false;
            setBusy(false);
            renderTable();
            setStatus('Canvis desats.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .saveAvSessionRows({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: selectedStudent,
            subject: selectedSubject,
            rows,
            studentAccountId: getCurrentStudentAccountId(),
            tutorComment: document.getElementById('tutor-comment').value,
            tutorCommentDirty: state.tutorCommentDirty
          });
      }

      function downloadStudentReport() {
        if (!state.selectedEvaluation || !state.selectedGroup || !state.rowsData || state.rowsData.mode !== 'student') return;

        const selectedStudent = document.getElementById('student-selector').value;
        const visibleRows = collectVisibleReportRows();
        if (!selectedStudent || !visibleRows.length) return;

        setBusy(true, 'Generant el PDF...');
        google.script.run
          .withSuccessHandler(file => {
            setBusy(false);
            triggerFileDownload(file, 'application/pdf');
            setStatus('Butlletí generat.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .createAvSessionStudentReportPdf({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: selectedStudent,
            rows: visibleRows,
            tutorComment: document.getElementById('tutor-comment').value
          });
      }

      function generateClosedBulletin(row) {
        if (!isClosedMode()) return;

        setBusy(true, 'Generant el butlletí...');
        google.script.run
          .withSuccessHandler(result => {
            mergeClosedBulletinResult(result);
            setBusy(false);
            renderClosedTable();
            setStatus('Butlletí generat.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .generateClosedBulletin({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: row.studentFullName,
            studentAccountId: row.studentAccountId
          });
      }

      function generateMissingClosedBulletins() {
        if (!isClosedMode()) return;

        const pendingRows = (state.evaluationData.closedRows || [])
          .filter(row => !row.bulletinUrl);
        if (!pendingRows.length) {
          setStatus('No hi havia butlletins pendents de generar.', 'success');
          return;
        }

        setBusy(true, 'Generant butlletins pendents...');
        generateNextClosedBulletin(pendingRows, 0, 0);
      }

      function generateNextClosedBulletin(pendingRows, index, generatedCount) {
        if (index >= pendingRows.length) {
          setBusy(false);
          renderClosedTable();
          setStatus(`S'han generat ${generatedCount} butlletins.`, 'success');
          return;
        }

        const row = pendingRows[index];
        setOverlayMessage(
          `Generant butlletí ${index + 1} de ${pendingRows.length}...`,
          row.studentFullName || ''
        );
        google.script.run
          .withSuccessHandler(result => {
            mergeClosedBulletinResult(result);
            generateNextClosedBulletin(pendingRows, index + 1, generatedCount + 1);
          })
          .withFailureHandler(error => {
            setBusy(false);
            renderClosedTable();
            showError(error);
          })
          .generateClosedBulletin({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: row.studentFullName,
            studentAccountId: row.studentAccountId
          });
      }

      function sendClosedBulletin(row) {
        if (!isClosedMode()) return;
        if (!row.bulletinUrl) {
          setStatus('Cal generar els documents abans d\'enviar-los.', 'error');
          return;
        }

        setBusy(true, 'Enviant correu...');
        google.script.run
          .withSuccessHandler(() => {
            reloadClosedData('Correu enviat.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .sendClosedBulletinEmail({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: row.studentFullName,
            studentAccountId: row.studentAccountId
          });
      }

      function sendPendingClosedEmails() {
        if (!isClosedMode()) return;

        setBusy(true, 'Enviant correus pendents...');
        google.script.run
          .withSuccessHandler(data => {
            replaceClosedRows(data);
            setBusy(false);
            renderClosedTable();
            setStatus(data.message || 'Correus enviats.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .sendPendingClosedBulletinEmails({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup
          });
      }

      function downloadClosedXlsx() {
        if (!isClosedMode()) return;

        setBusy(true, 'Generant l\'acta del grup...');
        google.script.run
          .withSuccessHandler(file => {
            setBusy(false);
            triggerFileDownload(file, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
            setStatus(file.message || 'Acta generada.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .createClosedGroupXlsx({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup
          });
      }

      function reloadClosedData(message, type) {
        google.script.run
          .withSuccessHandler(data => {
            state.evaluationData = data;
            setBusy(false);
            renderClosedMode();
            setStatus(message || data.message || '', type || 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .getAvSessionEvaluationData({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup
          });
      }

      function collectVisibleReportRows() {
        return Array.from(document.querySelectorAll('#table-body tr')).map(tr => {
          const sheetRow = Number(tr.dataset.sheetRow);
          const modelRow = (state.rowsData.rows || []).find(row => Number(row.sheetRow) === sheetRow) || {};
          const payload = collectRowPayload(tr);
          return {
            sheetRow,
            subjectFullName: modelRow.subjectFullName || '',
            pi: payload.pi,
            subjectEvaluation: payload.subjectEvaluation,
            concepts: payload.concepts
          };
        });
      }

      function triggerFileDownload(file, fallbackMimeType) {
        if (!file || !file.base64) throw new Error('No s\'ha pogut generar el fitxer.');

        const link = document.createElement('a');
        link.href = `data:${file.mimeType || fallbackMimeType || 'application/octet-stream'};base64,${file.base64}`;
        link.download = file.fileName || 'descarrega';
        document.body.appendChild(link);
        link.click();
        link.remove();
      }

      function mergeClosedBulletinResult(result) {
        if (!state.evaluationData || !Array.isArray(state.evaluationData.closedRows) || !result) return;

        state.evaluationData.closedRows = state.evaluationData.closedRows.map(row => {
          const sameAccount = result.studentAccountId && row.studentAccountId === result.studentAccountId;
          const sameName = result.studentFullName && row.studentFullName === result.studentFullName;
          return sameAccount || sameName
            ? Object.assign({}, row, { bulletinUrl: result.bulletinUrl || row.bulletinUrl })
            : row;
        });
      }

      function replaceClosedRows(data) {
        if (!state.evaluationData || !data || !Array.isArray(data.rows)) return;
        state.evaluationData.closedRows = data.rows;
      }

      function mergeSavedRowsIntoEvaluationData(rows) {
        if (!state.evaluationData || !Array.isArray(state.evaluationData.rows)) return;

        state.evaluationData.rows = mergeRowsBySheetRow(state.evaluationData.rows, rows);
      }

      function mergeSavedRowsIntoRowsData(rows) {
        if (!state.rowsData || !Array.isArray(state.rowsData.rows)) return;

        state.rowsData.rows = mergeRowsBySheetRow(state.rowsData.rows, rows);
      }

      function mergeRowsBySheetRow(baseRows, updatedRows) {
        const rowsBySheetRow = new Map((updatedRows || []).map(row => [String(row.sheetRow), row]));
        return (baseRows || []).map(row => rowsBySheetRow.get(String(row.sheetRow)) || row);
      }

      function mergeSavedTutorComment(savedComment) {
        if (!savedComment || !state.evaluationData) return;

        state.evaluationData.tutorCommentsByStudentAccountId = state.evaluationData.tutorCommentsByStudentAccountId || {};
        state.evaluationData.tutorCommentsByStudentName = state.evaluationData.tutorCommentsByStudentName || {};
        if (savedComment.studentAccountId) {
          state.evaluationData.tutorCommentsByStudentAccountId[savedComment.studentAccountId] = savedComment.tutorComment || '';
        }
        if (savedComment.studentFullName) {
          state.evaluationData.tutorCommentsByStudentName[savedComment.studentFullName] = savedComment.tutorComment || '';
        }
        state.lastTutorComment = savedComment.tutorComment || '';
        document.getElementById('tutor-comment').value = state.lastTutorComment;
      }

      function clearTable() {
        document.getElementById('table-head').innerHTML = '';
        document.getElementById('table-body').innerHTML = '';
        document.getElementById('table-wrap').hidden = true;
        resetTutorComment();
        updateNavigationButtons();
        updateActionButtons();
      }

      function navigateSelection(delta) {
        const mode = getCurrentSelectionMode();
        if (!mode) return;

        const selector = document.getElementById(mode === 'student' ? 'student-selector' : 'subject-selector');
        const values = getSelectorValues(selector);
        const index = values.indexOf(selector.value);
        const nextIndex = index + delta;
        if (nextIndex < 0 || nextIndex >= values.length) return;

        selector.value = values[nextIndex];
        loadRowsForCurrentSelection();
      }

      function updateNavigationButtons() {
        const prevButton = document.getElementById('prev-button');
        const nextButton = document.getElementById('next-button');
        if (isClosedMode()) {
          prevButton.disabled = true;
          nextButton.disabled = true;
          return;
        }
        const mode = getCurrentSelectionMode();
        if (!mode) {
          prevButton.disabled = true;
          nextButton.disabled = true;
          return;
        }

        const selector = document.getElementById(mode === 'student' ? 'student-selector' : 'subject-selector');
        const values = getSelectorValues(selector);
        const index = values.indexOf(selector.value);
        prevButton.disabled = index <= 0;
        nextButton.disabled = index < 0 || index >= values.length - 1;
      }

      function getCurrentSelectionMode() {
        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        if (selectedStudent) return 'student';
        if (selectedSubject) return 'subject';
        return '';
      }

      function getSelectorValues(selector) {
        return Array.from(selector.options)
          .map(option => option.value)
          .filter(Boolean);
      }

      function updateSaveButton() {
        const saveButton = document.getElementById('save-button');
        saveButton.hidden = isClosedMode();
        saveButton.disabled =
          isClosedMode() ||
          (!state.dirtyRows.size && !state.tutorCommentDirty) ||
          document.body.classList.contains('busy');
      }

      function updatePrintButton() {
        const printButton = document.getElementById('print-button');
        printButton.hidden = isClosedMode();
        printButton.disabled =
          isClosedMode() ||
          document.body.classList.contains('busy') ||
          !state.rowsData ||
          state.rowsData.mode !== 'student' ||
          !(state.rowsData.rows || []).length;
      }

      function updateClosedActionButtons() {
        const showClosedActions = isClosedMode();
        const hasRows = showClosedActions && state.evaluationData && (state.evaluationData.closedRows || []).length;
        ['csv-button', 'bulk-pdf-button', 'bulk-mail-button'].forEach(id => {
          const button = document.getElementById(id);
          button.hidden = !showClosedActions;
          button.disabled = !hasRows || document.body.classList.contains('busy');
        });
      }

      function updateActionButtons() {
        updateSaveButton();
        updatePrintButton();
        updateClosedActionButtons();
      }

      function setBusy(isBusy, message) {
        document.body.classList.toggle('busy', isBusy);
        document.getElementById('overlay').hidden = !isBusy;
        if (message && isBusy) {
          setOverlayMessage(message);
        }
        Array.from(document.querySelectorAll('select, input, textarea, button')).forEach(element => {
          if (element.id === 'save-button') {
            element.disabled = isBusy || isClosedMode() || (!state.dirtyRows.size && !state.tutorCommentDirty);
          } else if (element.id === 'print-button') {
            element.disabled = isBusy || isClosedMode() || !state.rowsData || state.rowsData.mode !== 'student' || !(state.rowsData.rows || []).length;
          } else if (['csv-button', 'bulk-pdf-button', 'bulk-mail-button'].includes(element.id)) {
            const hasRows = isClosedMode() && state.evaluationData && (state.evaluationData.closedRows || []).length;
            element.disabled = isBusy || !hasRows;
          } else {
            element.disabled = isBusy || element.dataset.locked === 'true';
          }
        });
      }

      function setOverlayMessage(message, detail) {
        document.getElementById('overlay-message').textContent = detail
          ? `${message}\n${detail}`
          : message;
      }

      function setStatus(message, type) {
        if (document.body.classList.contains('busy')) {
          document.getElementById('overlay-message').textContent = message || 'Carregant...';
          return;
        }

        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = `status ${type || ''}`.trim();
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), 'error');
      }

      function applyEvaluationColor(element, evaluationValue) {
        if (!element) return;

        const colors = state.rowsData && state.rowsData.subjectEvaluationColors || {};
        const color = normalizeHexColor(colors[evaluationValue] || '#FFFFFF');
        element.style.setProperty('--evaluation-color', color);
      }

      function normalizeHexColor(value) {
        const color = String(value || '').trim();
        return /^#[0-9a-fA-F]{6}$/.test(color) ? color.toUpperCase() : '#FFFFFF';
      }

      function createOption(value, label) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        return option;
      }

      function isClosedMode() {
        return state.evaluationData && state.evaluationData.mode === 'closed';
      }
    </script>
  </body>
</html>
