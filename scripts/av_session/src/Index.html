<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
        color: #202124;
        background: #f7f9fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 20px 96px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0 0 18px;
        color: #5f6368;
        line-height: 1.45;
      }

      .status {
        min-height: 24px;
        color: #5f6368;
      }

      .status.error {
        color: #b3261e;
      }

      .status.success {
        color: #137333;
      }

      label {
        display: grid;
        gap: 6px;
        color: #3c4043;
        font-size: 13px;
        font-weight: 700;
      }

      select,
      input[type="text"] {
        width: 100%;
        min-width: 0;
        height: 38px;
        border: 1px solid #c7cdd6;
        border-radius: 6px;
        padding: 0 10px;
        background: #fff;
        color: #202124;
        font-size: 14px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        align-items: end;
        margin: 22px 0;
      }

      .toolbar[hidden],
      .table-wrap[hidden] {
        display: none;
      }

      .table-wrap {
        overflow-x: auto;
        border-top: 1px solid #d8dee8;
        padding-top: 4px;
      }

      .table-title-nav {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) 38px;
        gap: 10px;
        align-items: center;
        margin: 20px 0 14px;
      }

      .nav-arrow {
        width: 38px;
        height: 38px;
        border: 1px solid #c7cdd6;
        border-radius: 6px;
        background: #fff;
        color: #202124;
        cursor: pointer;
        font-size: 22px;
        line-height: 1;
      }

      .nav-arrow:disabled {
        cursor: not-allowed;
        opacity: 0.38;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }

      th,
      td {
        border-bottom: 1px solid #e4e8ef;
        padding: 8px;
        text-align: left;
        vertical-align: middle;
      }

      th {
        background: #e9eef6;
        color: #202124;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      td {
        min-width: 160px;
      }

      td.primary-cell {
        min-width: 220px;
        font-weight: 600;
      }

      td.checkbox-cell,
      th.pi-header {
        width: 48px;
        min-width: 48px;
        max-width: 48px;
        text-align: center;
      }

      tr.dirty td {
        background: #fff6c7;
      }

      select.subject-evaluation-select {
        background: var(--evaluation-color, #fff);
      }

      .admin-note {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        margin-left: 8px;
        border: 1px solid #f2c94c;
        border-radius: 6px;
        padding: 0 8px;
        background: #fff8dc;
        color: #684e00;
        font-size: 12px;
        font-weight: 700;
      }

      .save-bubble {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 58px;
        height: 58px;
        border: 0;
        border-radius: 50%;
        background: #0b57d0;
        color: #fff;
        box-shadow: 0 8px 22px rgba(32, 33, 36, 0.28);
        font-size: 26px;
        line-height: 58px;
        cursor: pointer;
      }

      .save-bubble:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(248, 250, 253, 0.78);
        backdrop-filter: blur(1px);
        z-index: 10;
      }

      .overlay[hidden] {
        display: none;
      }

      .loader {
        display: grid;
        gap: 14px;
        justify-items: center;
        max-width: min(360px, calc(100vw - 48px));
        padding: 28px 32px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 34px rgba(32, 33, 36, 0.18);
        color: #202124;
        font-weight: 700;
        text-align: center;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid #c7d2e6;
        border-top-color: #0b57d0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      body.busy main,
      body.busy .save-bubble {
        filter: grayscale(0.35);
        opacity: 0.38;
        pointer-events: none;
        user-select: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 920px) {
        .toolbar {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 620px) {
        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body class="busy">
    <main>
      <h1>Sessió d'avaluació <span id="admin-note" class="admin-note" hidden>Admin</span></h1>
      <p id="subtitle" class="subtitle"></p>
      <div id="status" class="status"></div>

      <section id="toolbar" class="toolbar" hidden>
        <label for="evaluation-selector">
          Avaluació
          <select id="evaluation-selector"></select>
        </label>
        <label for="group-selector">
          Grup
          <select id="group-selector"></select>
        </label>
        <label for="student-selector">
          Alumne
          <select id="student-selector" disabled>
            <option value="">Selecciona un alumne...</option>
          </select>
        </label>
        <label for="subject-selector">
          Matèria
          <select id="subject-selector" disabled>
            <option value="">Selecciona una matèria...</option>
          </select>
        </label>
      </section>

      <section id="table-wrap" class="table-wrap" hidden>
        <div class="table-title-nav">
          <button id="prev-button" class="nav-arrow" type="button" aria-label="Anterior" title="Anterior" disabled>‹</button>
          <h2 id="table-title"></h2>
          <button id="next-button" class="nav-arrow" type="button" aria-label="Següent" title="Següent" disabled>›</button>
        </div>
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </section>
    </main>

    <button id="save-button" class="save-bubble" type="button" aria-label="Desar canvis" title="Desar canvis" disabled>💾</button>

    <div id="overlay" class="overlay">
      <div class="loader" role="status" aria-live="polite" aria-busy="true">
        <div class="spinner" aria-hidden="true"></div>
        <div id="overlay-message">Carregant dades...</div>
      </div>
    </div>

    <script>
      let state = {
        evaluations: [],
        groups: [],
        selectedEvaluation: '',
        selectedGroup: '',
        evaluationData: null,
        rowsData: null,
        dirtyRows: new Map()
      };

      document.addEventListener('DOMContentLoaded', loadInitialData);
      document.getElementById('evaluation-selector').addEventListener('change', handlePrimarySelectionChange);
      document.getElementById('group-selector').addEventListener('change', handlePrimarySelectionChange);
      document.getElementById('student-selector').addEventListener('change', handleStudentChange);
      document.getElementById('subject-selector').addEventListener('change', handleSubjectChange);
      document.getElementById('save-button').addEventListener('click', saveChanges);
      document.getElementById('prev-button').addEventListener('click', () => navigateSelection(-1));
      document.getElementById('next-button').addEventListener('click', () => navigateSelection(1));

      function loadInitialData() {
        setBusy(true, 'Carregant dades...');
        google.script.run
          .withSuccessHandler(data => {
            state.evaluations = data.evaluations || [];
            state.groups = data.groups || [];
            renderContext(data);
            renderPrimarySelectors();
            document.getElementById('toolbar').hidden = false;
            syncPrimarySelectionFromDom();
            if (state.selectedEvaluation && state.selectedGroup) {
              loadEvaluationData();
            } else {
              setBusy(false);
              setStatus('Selecciona una avaluació i un grup.');
            }
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .getAvSessionData();
      }

      function renderContext(data) {
        const actingTeacher = data.actingTeacher || {};
        const effectiveTeacher = data.effectiveTeacher || {};
        document.getElementById('admin-note').hidden = !data.isAdmin;
        document.getElementById('subtitle').textContent = data.isSubstituteActing
          ? `${actingTeacher.fullName} actuant per ${effectiveTeacher.fullName}`
          : effectiveTeacher.fullName || data.userEmail || '';
      }

      function renderPrimarySelectors() {
        const evaluationSelector = document.getElementById('evaluation-selector');
        const groupSelector = document.getElementById('group-selector');
        evaluationSelector.innerHTML = '<option value="">Selecciona una avaluació...</option>';
        groupSelector.innerHTML = '<option value="">Selecciona un grup...</option>';

        state.evaluations.forEach(evaluation => {
          evaluationSelector.appendChild(createOption(evaluation.sheetName, evaluation.name));
        });
        state.groups.forEach(group => {
          groupSelector.appendChild(createOption(group.dinantiaGroupName, group.dinantiaGroupName));
        });

        if (state.evaluations.length === 1) {
          evaluationSelector.value = state.evaluations[0].sheetName;
        }
        if (state.groups.length === 1) {
          groupSelector.value = state.groups[0].dinantiaGroupName;
        }

        syncPrimarySelectionFromDom();
      }

      function handlePrimarySelectionChange() {
        syncPrimarySelectionFromDom();
        state.evaluationData = null;
        state.rowsData = null;
        state.dirtyRows = new Map();
        resetDetailSelectors();
        clearTable();

        if (!state.selectedEvaluation || !state.selectedGroup) {
          setStatus('Selecciona una avaluació i un grup.');
          return;
        }

        loadEvaluationData();
      }

      function syncPrimarySelectionFromDom() {
        state.selectedEvaluation = document.getElementById('evaluation-selector').value;
        state.selectedGroup = document.getElementById('group-selector').value;
      }

      function loadEvaluationData() {
        setBusy(true, 'Carregant alumnes i matèries...');
        google.script.run
          .withSuccessHandler(data => {
            state.evaluationData = data;
            state.dirtyRows = new Map();
            renderDetailSelectors();
            setBusy(false);
            setStatus(data.message || 'Selecciona un alumne o una matèria.');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .getAvSessionEvaluationData({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup
          });
      }

      function resetDetailSelectors() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        studentSelector.innerHTML = '<option value="">Selecciona un alumne...</option>';
        subjectSelector.innerHTML = '<option value="">Selecciona una matèria...</option>';
        studentSelector.disabled = true;
        subjectSelector.disabled = true;
        updateSaveButton();
      }

      function renderDetailSelectors() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        studentSelector.innerHTML = '<option value="">Selecciona un alumne...</option>';
        subjectSelector.innerHTML = '<option value="">Selecciona una matèria...</option>';

        (state.evaluationData.students || []).forEach(student => {
          studentSelector.appendChild(createOption(student.name, student.name));
        });
        (state.evaluationData.subjects || []).forEach(subject => {
          subjectSelector.appendChild(createOption(subject, subject));
        });

        studentSelector.disabled = false;
        subjectSelector.disabled = false;
      }

      function handleStudentChange() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        if (studentSelector.value) {
          subjectSelector.value = '';
        }
        loadRowsForCurrentSelection();
      }

      function handleSubjectChange() {
        const studentSelector = document.getElementById('student-selector');
        const subjectSelector = document.getElementById('subject-selector');
        if (subjectSelector.value) {
          studentSelector.value = '';
        }
        loadRowsForCurrentSelection();
      }

      function loadRowsForCurrentSelection() {
        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        state.rowsData = null;
        state.dirtyRows = new Map();
        clearTable();

        if (!selectedStudent && !selectedSubject) {
          setStatus('Selecciona un alumne o una matèria.');
          return;
        }

        const rows = (state.evaluationData.rows || [])
          .filter(row => selectedStudent
            ? row.studentFullName === selectedStudent
            : row.subjectFullName === selectedSubject)
          .slice()
          .sort((a, b) => selectedStudent
            ? a.subjectFullName.localeCompare(b.subjectFullName, 'ca', { sensitivity: 'base' })
            : a.studentFullName.localeCompare(b.studentFullName, 'ca', { sensitivity: 'base' }));

        state.rowsData = {
          evaluation: state.evaluationData.evaluation,
          group: state.selectedGroup,
          mode: selectedStudent ? 'student' : 'subject',
          selectedStudent,
          selectedSubject,
          rows,
          subjectEvaluationOptions: state.evaluationData.subjectEvaluationOptions || [],
          subjectEvaluationColors: state.evaluationData.subjectEvaluationColors || {},
          conceptColumns: state.evaluationData.conceptColumns || [],
          message: rows.length ? '' : 'No hi ha files per a la selecció actual.'
        };
        renderTable();
        setStatus(state.rowsData.message || '');
      }

      function renderTable() {
        const tableWrap = document.getElementById('table-wrap');
        const tableTitle = document.getElementById('table-title');
        const tableHead = document.getElementById('table-head');
        const tableBody = document.getElementById('table-body');
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        if (!state.rowsData || !(state.rowsData.rows || []).length) {
          tableWrap.hidden = true;
          updateSaveButton();
          return;
        }

        const conceptColumns = state.rowsData.conceptColumns || [];
        const primaryHeader = state.rowsData.mode === 'student' ? 'Matèria' : 'Alumne';
        const titleDetail = state.rowsData.mode === 'student'
          ? state.rowsData.selectedStudent
          : state.rowsData.selectedSubject;
        tableTitle.textContent = `${state.selectedGroup} - ${titleDetail}`;
        tableHead.appendChild(renderHeaderRow(primaryHeader, conceptColumns));
        state.rowsData.rows.forEach(row => {
          tableBody.appendChild(renderDataRow(row, primaryHeader, conceptColumns));
        });
        tableWrap.hidden = false;
        updateNavigationButtons();
        updateSaveButton();
      }

      function renderHeaderRow(primaryHeader, conceptColumns) {
        const tr = document.createElement('tr');
        [primaryHeader, 'PI', 'Avaluació de la matèria']
          .concat(conceptColumns.map(concept => concept.header))
          .forEach((header, index) => {
            const th = document.createElement('th');
            th.textContent = header;
            if (index === 1) {
              th.className = 'pi-header';
            }
            tr.appendChild(th);
          });
        return tr;
      }

      function renderDataRow(row, primaryHeader, conceptColumns) {
        const tr = document.createElement('tr');
        tr.dataset.sheetRow = row.sheetRow;
        if (state.dirtyRows.has(String(row.sheetRow))) {
          tr.classList.add('dirty');
        }

        const primaryCell = document.createElement('td');
        primaryCell.className = 'primary-cell';
        primaryCell.textContent = primaryHeader === 'Matèria' ? row.subjectFullName : row.studentFullName;
        tr.appendChild(primaryCell);

        const piCell = document.createElement('td');
        piCell.className = 'checkbox-cell';
        const piInput = document.createElement('input');
        piInput.type = 'checkbox';
        piInput.checked = row.pi === true;
        piInput.dataset.role = 'pi';
        piInput.addEventListener('change', () => markDirty(tr));
        piCell.appendChild(piInput);
        tr.appendChild(piCell);

        const subjectCell = document.createElement('td');
        const subjectEvaluationSelect = createSelectInput(
          'subjectEvaluation',
          state.rowsData.subjectEvaluationOptions || [],
          row.subjectEvaluation
        );
        subjectEvaluationSelect.classList.add('subject-evaluation-select');
        applyEvaluationColor(subjectEvaluationSelect, row.subjectEvaluation);
        subjectEvaluationSelect.addEventListener('change', event => {
          applyEvaluationColor(event.target, event.target.value);
        });
        subjectCell.appendChild(subjectEvaluationSelect);
        tr.appendChild(subjectCell);

        conceptColumns.forEach(concept => {
          const td = document.createElement('td');
          const value = row.concepts && row.concepts[concept.header] || '';
          const input = concept.options && concept.options.length
            ? createSelectInput(`concept:${concept.header}`, concept.options, value)
            : createTextInput(`concept:${concept.header}`, value);
          td.appendChild(input);
          tr.appendChild(td);
        });

        return tr;
      }

      function createSelectInput(role, options, value) {
        const select = document.createElement('select');
        select.dataset.role = role;
        select.appendChild(createOption('', ''));
        options.forEach(option => select.appendChild(createOption(option, option)));
        select.value = value || '';
        select.addEventListener('change', event => markDirty(event.target.closest('tr')));
        return select;
      }

      function createTextInput(role, value) {
        const input = document.createElement('input');
        input.type = 'text';
        input.dataset.role = role;
        input.value = value || '';
        input.addEventListener('input', event => markDirty(event.target.closest('tr')));
        return input;
      }

      function markDirty(tr) {
        if (!tr) return;
        tr.classList.add('dirty');
        state.dirtyRows.set(String(tr.dataset.sheetRow), collectRowPayload(tr));
        updateSaveButton();
      }

      function collectRowPayload(tr) {
        const concepts = {};
        Array.from(tr.querySelectorAll('[data-role^="concept:"]')).forEach(input => {
          concepts[input.dataset.role.slice('concept:'.length)] = input.value;
        });

        return {
          sheetRow: Number(tr.dataset.sheetRow),
          pi: tr.querySelector('[data-role="pi"]').checked,
          subjectEvaluation: tr.querySelector('[data-role="subjectEvaluation"]').value,
          concepts
        };
      }

      function saveChanges() {
        const rows = Array.from(state.dirtyRows.values());
        if (!state.selectedEvaluation || !state.selectedGroup || !rows.length) return;

        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        setBusy(true, 'Desant...');
        google.script.run
          .withSuccessHandler(data => {
            const updatedRows = data.updatedRows || [];
            mergeSavedRowsIntoEvaluationData(updatedRows);
            mergeSavedRowsIntoRowsData(updatedRows);
            state.dirtyRows = new Map();
            setBusy(false);
            renderTable();
            setStatus('Canvis desats.', 'success');
          })
          .withFailureHandler(error => {
            setBusy(false);
            showError(error);
          })
          .saveAvSessionRows({
            sheetName: state.selectedEvaluation,
            group: state.selectedGroup,
            student: selectedStudent,
            subject: selectedSubject,
            rows
          });
      }

      function mergeSavedRowsIntoEvaluationData(rows) {
        if (!state.evaluationData || !Array.isArray(state.evaluationData.rows)) return;

        state.evaluationData.rows = mergeRowsBySheetRow(state.evaluationData.rows, rows);
      }

      function mergeSavedRowsIntoRowsData(rows) {
        if (!state.rowsData || !Array.isArray(state.rowsData.rows)) return;

        state.rowsData.rows = mergeRowsBySheetRow(state.rowsData.rows, rows);
      }

      function mergeRowsBySheetRow(baseRows, updatedRows) {
        const rowsBySheetRow = new Map((updatedRows || []).map(row => [String(row.sheetRow), row]));
        return (baseRows || []).map(row => rowsBySheetRow.get(String(row.sheetRow)) || row);
      }

      function clearTable() {
        document.getElementById('table-head').innerHTML = '';
        document.getElementById('table-body').innerHTML = '';
        document.getElementById('table-wrap').hidden = true;
        updateNavigationButtons();
        updateSaveButton();
      }

      function navigateSelection(delta) {
        const mode = getCurrentSelectionMode();
        if (!mode) return;

        const selector = document.getElementById(mode === 'student' ? 'student-selector' : 'subject-selector');
        const values = getSelectorValues(selector);
        const index = values.indexOf(selector.value);
        const nextIndex = index + delta;
        if (nextIndex < 0 || nextIndex >= values.length) return;

        selector.value = values[nextIndex];
        loadRowsForCurrentSelection();
      }

      function updateNavigationButtons() {
        const prevButton = document.getElementById('prev-button');
        const nextButton = document.getElementById('next-button');
        const mode = getCurrentSelectionMode();
        if (!mode) {
          prevButton.disabled = true;
          nextButton.disabled = true;
          return;
        }

        const selector = document.getElementById(mode === 'student' ? 'student-selector' : 'subject-selector');
        const values = getSelectorValues(selector);
        const index = values.indexOf(selector.value);
        prevButton.disabled = index <= 0;
        nextButton.disabled = index < 0 || index >= values.length - 1;
      }

      function getCurrentSelectionMode() {
        const selectedStudent = document.getElementById('student-selector').value;
        const selectedSubject = document.getElementById('subject-selector').value;
        if (selectedStudent) return 'student';
        if (selectedSubject) return 'subject';
        return '';
      }

      function getSelectorValues(selector) {
        return Array.from(selector.options)
          .map(option => option.value)
          .filter(Boolean);
      }

      function updateSaveButton() {
        document.getElementById('save-button').disabled = !state.dirtyRows.size || document.body.classList.contains('busy');
      }

      function setBusy(isBusy, message) {
        document.body.classList.toggle('busy', isBusy);
        document.getElementById('overlay').hidden = !isBusy;
        if (message && isBusy) {
          document.getElementById('overlay-message').textContent = message;
        }
        Array.from(document.querySelectorAll('select, input, button')).forEach(element => {
          if (element.id === 'save-button') {
            element.disabled = isBusy || !state.dirtyRows.size;
          } else {
            element.disabled = isBusy || element.dataset.locked === 'true';
          }
        });
      }

      function setStatus(message, type) {
        if (document.body.classList.contains('busy')) {
          document.getElementById('overlay-message').textContent = message || 'Carregant...';
          return;
        }

        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = `status ${type || ''}`.trim();
      }

      function showError(error) {
        setStatus(error && error.message ? error.message : String(error), 'error');
      }

      function applyEvaluationColor(element, evaluationValue) {
        if (!element) return;

        const colors = state.rowsData && state.rowsData.subjectEvaluationColors || {};
        const color = normalizeHexColor(colors[evaluationValue] || '#FFFFFF');
        element.style.setProperty('--evaluation-color', color);
      }

      function normalizeHexColor(value) {
        const color = String(value || '').trim();
        return /^#[0-9a-fA-F]{6}$/.test(color) ? color.toUpperCase() : '#FFFFFF';
      }

      function createOption(value, label) {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        return option;
      }
    </script>
  </body>
</html>
